# Options

## Server options

set-option -g default-terminal 'tmux-256color'

set-option -g escape-time 50
set-option -g history-limit 8192

set-option -g set-titles on
set-option -g set-titles-string '[#{session_name}:#{window_index}.#{pane_index}] #{pane_title}'

set-option -g status-keys vi

set-option -g status-left ' #{p6:[#{session_name}#{?session_many_attached,*,}]} \
#{host_short}(#{s|/dev/(tty)?||:client_tty}) \
[#{?client_prefix,P, }#{?alternate_on,A, }#{?search_present,/,#{?selection_present,S,#{?pane_in_mode,M, }}}]:  '
set-option -g status-left-length 50
set-option -g status-right '"#{=30:pane_title}" '
set-option -g status-style 'fg=brightwhite,bold,bg=black'

## Session options

set-option -s -g prefix C-a
set-option -s -g -a terminal-features '*-256color:RGB'
set-option -s -g -a terminal-features 'xterm*:osc7'

## Window options

set-option -w -g automatic-rename on
set-option -w -g automatic-rename-format '#{?pane_in_mode,[tmux],#{pane_path}}#{?pane_dead,[dead],}'
set-option -w -g mode-keys vi
set-option -w -g window-status-separator '  '

# Keybindings

unbind-key PPage
unbind-key Up
unbind-key Down
unbind-key Left
unbind-key Right
unbind-key '"'
unbind-key '%'

bind-key C-a last-window
bind-key C-b copy-mode -eu
bind-key C-c new-window
bind-key C-l refresh-client
bind-key C-n next-window
bind-key C-p previous-window

bind-key _ split-window -v
bind-key | split-window -h

bind-key a send-prefix
bind-key b choose-buffer "paste-buffer -p -b '%%'"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key o select-pane -t :.+
bind-key O select-pane -t :.-

bind-key -T copy-mode-vi [ send-keys -X previous-prompt
bind-key -T copy-mode-vi ] send-keys -X next-prompt

# Local config

source-file -q ~/.config/rc-local/.tmux.conf.local
source-file -q ~/.tmux.conf.local
